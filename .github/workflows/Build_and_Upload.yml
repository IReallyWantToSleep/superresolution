name: Build and Upload Artifacts

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit SHA to build (leave empty to use the selected branch HEAD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-native-linux:
    if: ${{ !contains(github.event.head_commit.message, 'SKIP') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.sha }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential ninja-build

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: 1.4.321.1
          cache: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Install Python packages
        run: pip install pyyaml simplejson

      - name: Initialize
        working-directory: native/cpp
        run: python init.py

      - name: Build native libraries (Linux)
        run: ./gradlew :native:clean :native:buildNative

      - name: Upload Linux native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-linux
          path: |
            common/src/main/resources/lib/**/*
          if-no-files-found: error

  build-native-windows:
    if: ${{ !contains(github.event.head_commit.message, 'SKIP') }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.sha }}
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: 1.4.321.1
          cache: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Install Python packages
        run: pip install pyyaml simplejson

      - name: Initialize
        working-directory: native/cpp
        run: python init.py

      - name: Build native libraries (Windows)
        run: .\gradlew.bat :native:clean :native:buildNative

      - name: Upload Windows native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-windows
          path: |
            common/src/main/resources/lib/**/*
          if-no-files-found: error

  build-and-upload:
    needs: [build-native-linux, build-native-windows]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - enable_auto_download: true
            upload_target: modrinth
          - enable_auto_download: false
            upload_target: curseforge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.sha }}
          submodules: recursive

      - name: Download Linux native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libs-linux
          path: common/src/main/resources/lib

      - name: Download Windows native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libs-windows
          path: common/src/main/resources/lib

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle build properties
        env:
          GRADLE_IS_DEV: 'false'
          GRADLE_USE_DEBUG_LIB: 'false'
          GRADLE_IS_VULKAN: 'false'
          GRADLE_ENABLE_AUTO_DOWNLOAD: ${{ matrix.enable_auto_download }}
        run: python3 .github/scripts/update_gradle_properties.py

      - name: Build all versions
        run: ./gradlew buildAllVersions

      - name: Upload to Modrinth
        if: matrix.upload_target == 'modrinth'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: printf 'Y\nY\n' | ./gradlew uploadToModrinth

      - name: Upload to CurseForge
        if: matrix.upload_target == 'curseforge'
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: printf 'Y\n' | ./gradlew uploadToCurseForge
