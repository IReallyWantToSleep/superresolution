modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/187J3X1-114514/superresolution/issues"
license = "MIT"

[[mods]]
modId = "super_resolution"
version = "${version}"
displayName = "Super Resolution"
authors = "187J3X1"
description = '''
喵
'''
logoFile = "assets/super_resolution/textures/gui/logo.png"

[[dependencies.super_resolution]]
modId = "minecraft"
mandatory = true
versionRange = "{versionRange}"
ordering = "NONE"
side = "BOTH"

# Forge 1.20.1 没有 INCOMPATIBLE 依赖类型，用"可选依赖 + 不存在的版本"代替：这些 mod 存在时报版本不匹配错误，缺席时忽略
[[dependencies.super_resolution]]
modId = "resolutioncontrol-plus-plus"
mandatory = false
versionRange = "[INCOMPATIBLE]"
ordering = "NONE"
side = "BOTH"

[[dependencies.super_resolution]]
modId = "resolutioncontrol-plus"
mandatory = false
versionRange = "[INCOMPATIBLE]"
ordering = "NONE"
side = "BOTH"

[[dependencies.super_resolution]]
