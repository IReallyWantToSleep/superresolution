architectury {
    common("fabric", "forge")
}

loom {
    accessWidenerPath = file("src/main/resources/super_resolution.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    //modImplementation "me.shedaniel.cloth:cloth-config:${project.cloth_config_version}"
    //modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}+${project.minecraft_version}-fabric"
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"
    implementation("io.github.spair:imgui-java-app:1.87.5")
    implementation("io.github.spair:imgui-java-binding:1.87.5")
    implementation("io.github.spair:imgui-java-lwjgl3:1.87.5")
    implementation "org.anarres:jcpp:1.4.14"
    implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion")
    implementation("org.lwjgl:lwjgl-shaderc")
    implementation("org.lwjgl:lwjgl-shaderc::natives-windows")
}

tasks.register("genJNIHEAD") {
    def out = new ByteArrayOutputStream()
    doLast {
        exec {
            mkdir "$project.rootDir/native-cpp/include"
            mkdir "$project.buildDir"
            workingDir "$project.projectDir/src/main/java"
            commandLine "javac", "-h", "$project.rootDir", "$project.projectDir/src/main/java/oiiaio/fsr/NativeLib.java", "-d", "$project.buildDir/jni/"
            standardOutput = out
        }
        delete("$project.buildDir/jni/")
        logger.info(out.toString())
    }
}