##### Gradle #####
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
# Bound concurrent workers: the default is nproc, and each forked JavaCompile
# gets its own heap, so an unbounded worker count can reserve far more than RAM.
org.gradle.workers.max=8

